# .github/workflows/experiences.yml
#
# Each Experience ships its own THING. The workflow discovers every
# experiences/*/experience.json, then delegates everything else to crisp:
# each THING is packaged (`crisp package`: manifest and mount validation,
# build, content-addressed output chunks, wiring-manifest receipt) and
# verified (`crisp verify`: the chunks re-hashed against the receipt, the
# honest check) in its own matrix leg (fail-fast: false, so one broken build
# never blocks the others). The launcher then wires the resulting artifacts
# together and the Page deploys.
#
# This file is a thin wrapper by design. All build, test, and package logic
# lives in crisp/; this workflow only calls it. crisp's own test suite runs
# first: a red packager blocks the whole Page.
#
# Browser coverage (scaffold, NTC console, studio sandboxes) runs in its own
# job. It never blocks the Page, but its results are always uploaded, so a
# red browser run stays visible instead of silently vanishing.

name: experiences
on:
  push:
    branches: [main]
    paths:
      - 'experiences/**'
      - 'launcher/**'
      - 'crisp/**'
      - 'tidy/**'
      - 'mock-pxc/**'
      - 'local/**'
      - 'vendor/**'
      - '.neat/**'
      - '.tidy/**'
      - '.github/workflows/experiences.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  crisp-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: crisp self-test
        # The packager must be green before it touches any THING.
        run: node crisp/test/run.mjs

  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: matrix
        run: |
          matrix=$(for d in experiences/*/; do
            [ -f "${d}experience.json" ] || continue
            node crisp/bin/crisp resolve "$d" | jq -c --arg id "$(basename "$d")" '. + {id: $id}'
          done | jq -cs '.')
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"

  build:
    needs: [discover, crisp-selftest]
    if: ${{ needs.discover.outputs.matrix != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        exp: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: package THING with crisp
        run: |
          node crisp/bin/crisp package "experiences/${{ matrix.exp.id }}"
          node crisp/bin/crisp verify "experiences/${{ matrix.exp.id }}/.crisp/receipt.json" "experiences/${{ matrix.exp.id }}/${{ matrix.exp.outDir }}"
      - name: stage artifact
        run: |
          mkdir -p "staging/${{ matrix.exp.id }}"
          cp -r "experiences/${{ matrix.exp.id }}/${{ matrix.exp.outDir }}/." "staging/${{ matrix.exp.id }}/"
          cp "experiences/${{ matrix.exp.id }}/.crisp/receipt.json" "staging/${{ matrix.exp.id }}/receipt.json"
      - uses: actions/upload-artifact@v4
        with:
          name: exp-${{ matrix.exp.id }}
          path: staging/${{ matrix.exp.id }}
          if-no-files-found: error

  browser-tests:
    needs: [crisp-selftest]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: verify local adapter and crisp fixtures
        run: node --test local/test/*.test.mjs
      - name: install the browser test runner
        run: |
          npm install --prefix "$RUNNER_TEMP/pxcube-browser" --no-save playwright@1.62.1
          node "$RUNNER_TEMP/pxcube-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: generate and exercise a sandbox through crisp
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/pxcube-browser/node_modules/playwright/index.mjs
        run: node local/test/scaffold-browser.mjs
      - name: inspect the NTC console and retain an Experience across views
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/pxcube-browser/node_modules/playwright/index.mjs
          NTC_FIXTURE: '1'
        run: node local/test/ntc-browser.mjs
      - name: same packaging program as local preview
        run: node local/ci.mjs
      - name: E2E the five experiences against MockPxC, no browser
        run: node --test "local/test/e2e/*.test.mjs"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: pxcube-browser-results
          path: |
            .pxcube/runs/
            evidence/build-bag-scaffold/
            evidence/ntc-console/
          include-hidden-files: true

  assemble:
    needs: [discover, build]
    outputs:
      site-ready: ${{ steps.assemble.outputs.site-ready }}
    # Ship what built; mark the rest failed on the launcher. Never let one
    # red THING cancel the whole Page.
    if: ${{ !cancelled() && (needs.build.result == 'success' || needs.build.result == 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: exp-*
          path: staging
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: assemble the same NTC site as local preview
        id: assemble
        continue-on-error: true
        run: node local/ci.mjs --staged staging
      - uses: actions/upload-pages-artifact@v4
        if: ${{ !cancelled() && steps.assemble.outputs.site-ready == 'true' }}
        with:
          path: dist
      - name: keep failed package attempts red
        if: ${{ !cancelled() && steps.assemble.outcome == 'failure' }}
        run: exit 1

  deploy:
    needs: assemble
    if: ${{ !cancelled() && needs.assemble.outputs.site-ready == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
