name: experiences
on:
  push:
    branches: [main]
    paths:
      - 'experiences/**'
      - 'launcher/**'
      - 'crisp/**'
      - 'tidy/**'
      - 'mock-pxc/**'
      - 'local/**'
      - 'vendor/**'
      - '.neat/**'
      - '.tidy/**'
      - '.github/workflows/experiences.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.ready.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: verify local adapter and crisp fixtures
        run: node --test local/test/*.test.mjs
      - name: install the browser test runner
        run: |
          npm install --prefix "$RUNNER_TEMP/pxcube-browser" --no-save playwright@1.62.1
          node "$RUNNER_TEMP/pxcube-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: generate and exercise a sandbox through crisp
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/pxcube-browser/node_modules/playwright/index.mjs
        run: node local/test/scaffold-browser.mjs
      - name: same packaging program as local preview
        run: node local/ci.mjs
      - id: ready
        if: ${{ !cancelled() && hashFiles('dist/index.html') != '' }}
        run: echo 'ready=true' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v4
        if: ${{ !cancelled() && steps.ready.outputs.ready == 'true' }}
        with:
          path: dist
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: pxcube-attempts
          path: |
            .pxcube/runs/
            evidence/build-bag-scaffold/
          include-hidden-files: true
  deploy:
    needs: package
    # A failed app keeps the package job red. Its healthy siblings still ship.
    if: ${{ !cancelled() && needs.package.outputs.ready == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
